<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211A45"/>
      <stop offset="1" stop-color="#0A0C18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B69CFF"/>
      <stop offset="0.55" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#4C2FD6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <mask id="hole">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <!-- keyhole that is also a person: round head, tapered body -->
      <circle cx="512" cy="420" r="88" fill="#000"/>
      <path d="M474 486 L550 486 C 606 548 626 630 626 668 Q626 698 596 698 L428 698 Q398 698 398 668 C 398 630 418 548 474 486 Z" fill="#000"/>
    </mask>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="222.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="292" y="232" width="440" height="580" rx="64" fill="url(#back)" transform="rotate(-17 512 522)"/>
    <rect x="292" y="232" width="440" height="580" rx="64" fill="url(#mid)" transform="rotate(-6.5 512 522)"/>
    <g transform="rotate(5 512 522)">
      <rect x="292" y="232" width="440" height="580" rx="64" fill="url(#front)" mask="url(#hole)"/>
      <rect x="292" y="232" width="440" height="580" rx="64" fill="url(#sheen)" mask="url(#hole)"/>
      <rect x="440" y="740" width="144" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.55"/>
    </g>
  </g>
</svg>
